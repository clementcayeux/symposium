{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Équipe | Symposium CentraleSupélec</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="{% url 'home' %}">
                <img src="{% static 'core/assets/logo.png' %}" alt="Logo Symposium" class="nav-logo">
            </a>
            <span class="logo-text">SYMPOSIUM</span>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Accueil</a></li>
            <li><a href="{% url 'equipe' %}" class="active">L'Équipe</a></li>
            <li><a href="{% url 'home' %}#conferences">Conférences</a></li>
            <li><a href="{% url 'home' %}#archives">Archives</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>L'Équipe Symposium</h1>
        <p>Ceux qui font vivre le débat à CentraleSupélec</p>
    </header>

    <section class="section-container">
        <div class="team-grid">
            <div class="team-card">
                <div class="member-img" style="background-image: url('{% static 'core/assets/president.jpg' %}');"></div>
                <div class="member-info">
                    <h3>Nom Prénom</h3>
                    <p class="role">Président</p>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                    </div>
                </div>
            </div>
            </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">SYMPOSIUM</div>
            <p>contact@symposium-cs.fr</p>
            <div class="footer-bottom">&copy; 2026 Symposium CentraleSupélec</div>
        </div>
    </footer>

</body>
</html>
